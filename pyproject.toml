[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepquant"
version = "0.3.0"
description = "Spatial-temporal recurrent-state quantization for GDN and KDA"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24"]

[project.optional-dependencies]
qwen = ["transformers==5.8.1", "accelerate>=1.0", "safetensors>=0.4"]
kimi = ["transformers==4.57.1", "accelerate>=1.0", "fla-core==0.4.1", "einops>=0.8", "tiktoken>=0.7"]
data = ["datasets>=3"]
test = ["pytest>=8"]
fused = ["triton>=3.6", "cuda-bindings>=13.0"]
sglang = ["sglang==0.5.12", "cuda-bindings>=13.0"]

[project.scripts]
stepquant = "stepquant.cli:main"

[tool.setuptools.packages.find]
include = ["stepquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.entry-points."sglang.srt.plugins"]
stepquant = "stepquant.sglang.plugin:register"
